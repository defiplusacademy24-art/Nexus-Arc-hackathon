[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

# Remappings (also written to remappings.txt by forge)
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

# ── Arc Testnet ──────────────────────────────────────────────────────────────
# Chain ID 5042002 — USDC gas, EVM-compatible L1 by Circle
[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
# ArcScan verification (if API key available)
# arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
